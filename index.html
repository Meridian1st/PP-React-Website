<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Purpose Partners — Charity &amp; social enterprise consultancy</title>
    <meta
      name="description"
      content="Strategy, income and governance work for charities and social enterprises — and social value, CSR and ESG strategy for the businesses that fund and partner with them."
    />

    <!-- Brand icons. SVG first for modern browsers, 32px PNG as the fallback. -->
    <link rel="icon" type="image/svg+xml" href="/brand/purpose-partners-icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="apple-touch-icon" href="/brand/purpose-partners-icon-192w.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Tints the browser chrome on mobile to the brand teal. -->
    <meta name="theme-color" content="#027F7C" />

    <!-- Social sharing. NOTE: og:image should be an absolute URL once the
         production domain is known — most scrapers will not resolve a
         relative path. Swap in https://yourdomain.co.uk/brand/... then. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Purpose Partners" />
    <meta
      property="og:title"
      content="Purpose Partners — Charity &amp; social enterprise consultancy"
    />
    <meta
      property="og:description"
      content="Strategy, income and governance work for charities and social enterprises — and social value, CSR and ESG strategy for the businesses that fund and partner with them."
    />
    <meta property="og:image" content="/brand/purpose-partners-primary-1200w.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/brand/purpose-partners-primary-1200w.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&family=Familjen+Grotesk:wght@400;500;600;700&family=Montserrat:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
